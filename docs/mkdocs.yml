# cl-parser-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-parser-kit
site_description: >-
  A small, practical parser toolkit for Common Lisp — tokenizers, parser
  combinators, Pratt parsing, structured diagnostics, and AST/CST helpers.
site_author: cl-parser-kit contributors
site_url: https://nerima-lisp.github.io/cl-parser-kit/

repo_name: nerima-lisp/cl-parser-kit
repo_url: https://github.com/nerima-lisp/cl-parser-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-parser-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/format-list-group
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-parser-kit
      name: cl-parser-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix / ASDF / Quicklisp install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Core Concepts: core-concepts.md
      - Parsing Patterns: parsing-patterns.md
      - Examples: examples.md
  - Reference:
      - API Reference: api.md
      - Architecture: architecture.md
      - Roadmap: roadmap.md
  - Governance:
      - Code of Conduct: code-of-conduct.md
      - Contributing: contributing.md
      - Governance: governance.md
      - Maintainers: maintainers.md
      - Security Policy: security.md
      - Support Policy: support.md
      - Versioning Policy: versioning.md
      - Release Process: releasing.md
