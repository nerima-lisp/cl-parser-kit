# cl-parser-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build --strict --config-file docs/mkdocs.yml
# Serve:   mkdocs serve --config-file docs/mkdocs.yml
#
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-parser-kit
site_description: >-
  A small, practical parser toolkit for Common Lisp — tokenizers, parser
  combinators, Pratt parsing, structured diagnostics, and AST/CST helpers.
site_author: cl-parser-kit contributors
site_url: https://nerima-lisp.github.io/cl-parser-kit/

repo_name: nerima-lisp/cl-parser-kit
repo_url: https://github.com/nerima-lisp/cl-parser-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src.
docs_dir: src
site_dir: ../site
use_directory_urls: true
strict: true

copyright: Copyright &copy; cl-parser-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/format-list-group
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-parser-kit
      name: cl-parser-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix / ASDF / Quicklisp install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# DOCS_STANDARD.md fixes the six sections and their order. The order tracks the
# reader's state: Getting Started has not run it yet, Guide has it running but
# does not know the design, Reference is looking up one answer, Internals is
# about to change it, Project is about to contribute. Readership drops along
# that axis, so reference and internals sit at the back.
#
# Every page under src/ must appear here: --strict fails the build on an
# unlisted page.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Core Concepts: guide/core-concepts.md
      - Recipes: guide/recipes.md
      - Parsing Patterns: guide/parsing-patterns.md
      - Diagnostics: guide/diagnostics.md
      - Examples: guide/examples.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Compatibility: reference/compatibility.md
  - Project:
      - Development: project/development.md
      - Roadmap: project/roadmap.md

not_in_nav: |
  notes/
