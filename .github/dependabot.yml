version: 2
updates:
  # Workflow files under .github/workflows/. Dependabot bumps the pinned action
  # SHAs and keeps the "# vN" comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
